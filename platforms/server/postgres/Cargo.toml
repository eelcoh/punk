[package]
name = "punk-server-postgres"
description = "A Postgres database for punkroc's server platform: a pool of connections as a punk-server Database."
version = "0.1.0"
edition = "2024"
publish = false

# A library for the wiring of an app (its main.rs and tests), on Linux and macOS: the app itself
# only sees the `Database` capability of punk-server. See platforms/server/README.md.
[lib]
path = "src/lib.rs"

[dependencies]
ambit-lockdown = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }
bytes = "1"
postgres = { version = "0.19", default-features = false }
punk-server = { path = "../host" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
tokio-postgres-rustls = "0.14.0"
tracing = "0.1"
webpki-roots = "1.0.12"
