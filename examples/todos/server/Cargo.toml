[package]
name = "punk-todos"
description = "A JSON API for a todo list in punk (../Todos.punk), with its todos in Postgres, on punk's server platform."
version = "0.1.0"
edition = "2024"
publish = false

# `build.rs` compiles Todos.punk with `punk build`, as for ../../shortener-postgres.
[lib]
name = "todos"
path = "src/lib.rs"

[[bin]]
name = "punk-todos"
path = "src/main.rs"

# ambit, pinned to the same commit as platforms/server/host.
[dependencies]
ambit-caps = { git = "https://github.com/eelcoh/ambit", rev = "b5f977178e408a4aa96c75d7ed073bb2f65be414" }
ambit-lockdown = { git = "https://github.com/eelcoh/ambit", rev = "b5f977178e408a4aa96c75d7ed073bb2f65be414" }
ambit-server = { git = "https://github.com/eelcoh/ambit", rev = "b5f977178e408a4aa96c75d7ed073bb2f65be414" }
ambit-server-native = { git = "https://github.com/eelcoh/ambit", rev = "b5f977178e408a4aa96c75d7ed073bb2f65be414" }
punk-server = { path = "../../../platforms/server/host" }
punk-server-postgres = { path = "../../../platforms/server/postgres" }

[dev-dependencies]
ambit-server-sim = { git = "https://github.com/eelcoh/ambit", rev = "b5f977178e408a4aa96c75d7ed073bb2f65be414" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
