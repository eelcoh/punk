# punk-lang's releases: what install.sh downloads.
#
# On a tag `v*` (e.g. `git tag v0.1.0 && git push origin v0.1.0`), build punk
# on each supported computer, build the cli platform's host there, run the
# golden tests, pack the result with tools/release/package.sh, and publish a
# GitHub release with the archives and their SHA256SUMS. By hand
# (workflow_dispatch) it does the same without publishing: the archives are
# kept as the run's artifacts, to try a release first.

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04        # linux-x86_64
          - runner: ubuntu-24.04-arm    # linux-aarch64
          - runner: macos-15            # macos-aarch64
          - runner: macos-15-intel      # macos-x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.17.1
          use-cache: false
      - name: Version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="$GITHUB_REF_NAME"; else v="v0.0.0-${GITHUB_SHA::7}"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Build the compiler
        run: zig build -Doptimize=ReleaseSafe
      - name: Build the cli platform's host
        run: sh test/setup.sh
      - name: Golden tests
        run: sh test/golden.sh
      - name: Pack
        run: sh tools/release/package.sh "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: punk-${{ matrix.runner }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # The VS Code extension (editors/vscode) as a .vsix, with the release's
  # version, for the release and (with the secret VSCE_PAT) the Marketplace.
  vscode:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci && npm test
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0"; fi
          npm version --no-git-tag-version --allow-same-version "$v"
          npx --yes @vscode/vsce@3 package --no-dependencies --skip-license -o "punk-lang-$v.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: punk-vscode
          path: editors/vscode/*.vsix
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [build, vscode]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.tar.gz *.vsix > SHA256SUMS && cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.vsix dist/SHA256SUMS --title "punk-lang $GITHUB_REF_NAME" --generate-notes --verify-tag
      # Only with the secret VSCE_PAT (a Marketplace token of the publisher
      # in editors/vscode/package.json); without it the .vsix is only on the release.
      - name: Publish the VS Code extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "no VSCE_PAT; the extension is only on the release"; exit 0; fi
          npx --yes @vscode/vsce@3 publish --packagePath dist/*.vsix
