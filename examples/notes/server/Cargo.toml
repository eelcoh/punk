[package]
name = "punk-notes"
description = "Notes per user in punk (../Notes.punk), kept apart by row-level security in Postgres, on punk's server platform."
version = "0.1.0"
edition = "2024"
publish = false

# `build.rs` compiles Notes.punk with `punk build`, as for ../../shortener-postgres.
[lib]
name = "notes"
path = "src/lib.rs"

[[bin]]
name = "punk-notes"
path = "src/main.rs"

# ambit, pinned to the same commit as platforms/server/host.
[dependencies]
ambit-caps = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }
ambit-lockdown = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }
ambit-server = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }
ambit-server-native = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }
punk-server = { path = "../../../platforms/server/host" }
punk-server-postgres = { path = "../../../platforms/server/postgres" }

[dev-dependencies]
ambit-server-sim = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
