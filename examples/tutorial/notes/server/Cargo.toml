[package]
name = "notes"
description = "The server of Notes.punk, on punk's server platform, with Postgres."
version = "0.1.0"
edition = "2024"
publish = false

# `build.rs` compiles ../Notes.punk with `punk build`.
[lib]
name = "notes"
path = "src/lib.rs"

[[bin]]
name = "notes"
path = "src/main.rs"

# punk's server platform, and ambit at the commit that platform uses.
[dependencies]
ambit-caps = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }
ambit-server = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }
punk-server = { path = "../../../../platforms/server/host" }
punk-server-postgres = { path = "../../../../platforms/server/postgres" }
tracing = "0.1"

# The wiring on Linux and macOS (src/main.rs): ambit's native backend, locked down.
[target.'cfg(not(target_os = "hermit"))'.dependencies]
ambit-lockdown = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }
ambit-server-native = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }

# The wiring as a Hermit unikernel (src/hermit.rs): ambit's hermit backend, and the kernel with
# the deployment profile of ambit's run-hermit (QEMU: virtio-net over PCI, ACPI, DHCP).
[target.'cfg(target_os = "hermit")'.dependencies]
ambit-server-hermit = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }
hermit = { git = "https://github.com/hermit-os/hermit-rs.git", tag = "hermit-0.13.2", default-features = false, features = ["acpi", "pci", "tcp", "dhcpv4", "dns", "virtio-net"] }

[dev-dependencies]
ambit-server-sim = { git = "https://github.com/eelcoh/ambit", rev = "d039ab5afb81fe81faa5ce00c41e937e4879ea85" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true

# Crates the Postgres driver needs, with what Hermit needs added (platforms/server/hermit).
# Elsewhere they are the same as on crates.io.
[patch.crates-io]
ring = { path = "../../../../platforms/server/hermit/vendor/ring" }
socket2 = { path = "../../../../platforms/server/hermit/vendor/socket2" }
tokio = { path = "../../../../platforms/server/hermit/vendor/tokio" }
whoami = { path = "../../../../platforms/server/hermit/vendor/whoami" }
