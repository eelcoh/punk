# punk's CI.
#
# - golden: on every push to and PR into `main`, build the compiler (Roc,
#   pinned in build.zig.zon, with punk's seam), run the translator's and the
#   hosts' unit tests, the golden tests of examples/ (test/golden.sh), and
#   the server and terminal apps, with Postgres and Mongo in postgres:16 and
#   mongo:7 containers.
# - upstream: on the 1st and 15th of each month (and by hand), merge
#   roc-lang/roc's main into eelcoh/roc's `punkroc` branch (Roc with the
#   places that call punk's seam), run the same tests with that Roc, and
#   only when they pass push the merge to eelcoh/roc, pin it here and open a
#   PR into `main`. On a conflict or a failing test it opens an issue
#   instead. It only ever fetches from roc-lang/roc. Pushing to eelcoh/roc
#   needs the secret ROC_PUSH_TOKEN (a token that may write to eelcoh/roc).

name: punk

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 5 1,15 * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: punk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golden:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres: &postgres
        image: postgres:16
        env:
          POSTGRES_PASSWORD: punk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
      mongo: &mongo
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      PUNK_TEST_POSTGRES: postgres://postgres:punk@localhost:5432/postgres
      PUNK_REQUIRE_POSTGRES: "1"
      PUNK_TEST_MONGO: mongodb://localhost:27017
      PUNK_REQUIRE_MONGO: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - &setup_zig
        uses: xyzzylabs/setup-zig@09d85d9dbb73308882e7a26e61a8f706eed40df1 # ratchet:xyzzylabs/setup-zig@v1.0.2
        with:
          version: 0.17.1
          use-cache: false
      - &cache_deps
        name: Cache Zig dependency packages
        uses: actions/cache@v6.1.0 # ratchet:actions/cache@v6.1.0
        with:
          path: ${{ env.ZIG_GLOBAL_CACHE_DIR }}/p
          key: zig-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.zig.zon') }}
          restore-keys: |
            zig-deps-${{ runner.os }}-${{ runner.arch }}-
      - name: Build and test
        run: sh test/ci.sh

  upstream:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write
      issues: write
    services:
      postgres: *postgres
      mongo: *mongo
    env:
      GH_TOKEN: ${{ github.token }}
      PUNK_TEST_POSTGRES: postgres://postgres:punk@localhost:5432/postgres
      PUNK_REQUIRE_POSTGRES: "1"
      PUNK_TEST_MONGO: mongodb://localhost:27017
      PUNK_REQUIRE_MONGO: "1"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # ratchet:actions/checkout@v6.0.2
        with:
          repository: eelcoh/roc
          ref: punkroc
          path: roc
          fetch-depth: 0
          token: ${{ secrets.ROC_PUSH_TOKEN || github.token }}
      - name: Merge roc-lang/roc main into eelcoh/roc punkroc
        id: merge
        working-directory: roc
        run: |
          set -eu
          git config user.name "punk-ci"
          git config user.email "punk-ci@users.noreply.github.com"
          git remote add upstream https://github.com/roc-lang/roc.git
          # Never push to upstream.
          git remote set-url --push upstream no-push-to-upstream
          git fetch --no-tags upstream main
          branch="upstream-merge/$(date -u +%Y-%m-%d)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git rev-parse --short FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo "punkroc already has upstream's main"
            echo "nothing=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git checkout -b "$branch"
          if ! git merge --no-edit -m "Merge roc-lang/roc main ($(git rev-parse --short FETCH_HEAD)) into punkroc" FETCH_HEAD; then
            git diff --name-only --diff-filter=U > ../conflicts.txt
            exit 1
          fi
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - *setup_zig
      - *cache_deps
      - name: Build and test with the merged Roc
        if: steps.merge.outputs.nothing != 'yes'
        run: ZIG_BUILD_FLAGS="--fork=$PWD/roc" sh test/ci.sh
      - name: Push the merge, pin it, and open a PR
        if: steps.merge.outputs.nothing != 'yes'
        run: |
          set -eu
          branch="${{ steps.merge.outputs.branch }}"
          commit="${{ steps.merge.outputs.commit }}"
          (cd roc && git push origin "$branch")
          gh pr create --repo eelcoh/roc --base punkroc --head "$branch" \
            --title "Merge upstream Roc (${{ steps.merge.outputs.upstream }})" \
            --body "Merge of roc-lang/roc main into punkroc, for eelcoh/punk. punk's tests passed with it ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))." || true
          mkdir export && (cd roc && git archive HEAD) | tar -x -C export
          hash=$(zig fetch ./export)
          sed -i "s|roc#[0-9a-f]*\"|roc#$commit\"|; s|\.hash = \"roc-[^\"]*\"|.hash = \"$hash\"|" build.zig.zon
          git config user.name "punk-ci"
          git config user.email "punk-ci@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "Pin Roc to upstream ${{ steps.merge.outputs.upstream }}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Roc: upstream ${{ steps.merge.outputs.upstream }}" \
            --body "Pins Roc to eelcoh/roc $commit: punkroc with roc-lang/roc main (${{ steps.merge.outputs.upstream }}) merged in. The tests passed with it ([run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}))."
      - name: Report a failed merge
        if: failure()
        run: |
          conflicts=""
          [ -f conflicts.txt ] && conflicts="Conflicting files:
          $(sed 's/^/- /' conflicts.txt)"
          gh issue create \
            --title "Upstream Roc merge failed ($(date -u +%Y-%m-%d))" \
            --body "Merging roc-lang/roc main into eelcoh/roc punkroc, or testing punk with it, failed, so nothing was pinned. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
          $conflicts"
